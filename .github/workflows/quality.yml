name: Qualidade do FinanFlow
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: npx --yes pnpm@12.11.2 install --frozen-lockfile --ignore-scripts
      - run: npx --yes pnpm@12.11.2 lint
      - run: npx --yes pnpm@12.11.2 test
      - run: npx --yes pnpm@12.11.2 build
      - run: npx --yes pnpm@12.11.2 audit --audit-level=moderate
