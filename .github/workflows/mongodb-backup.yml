name: Backup semanal do MongoDB
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuração
        id: config
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          if [ -n "$MONGODB_URI" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Backup aguardando o secret MONGODB_URI."
          fi
      - name: Instalar MongoDB Database Tools
        if: steps.config.outputs.ready == 'true'
        run: |
          curl -fsSL https://pgp.mongodb.com/server-8.0.asc | sudo gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
          echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/8.0 multiverse" | sudo tee /etc/apt/sources.list.d/mongodb-org-8.0.list
          sudo apt-get update && sudo apt-get install -y mongodb-database-tools
      - name: Criar backup
        if: steps.config.outputs.ready == 'true'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: mongodump --uri="$MONGODB_URI" --archive=finanflow.archive.gz --gzip
      - name: Criar checksum
        if: steps.config.outputs.ready == 'true'
        run: sha256sum finanflow.archive.gz > finanflow.archive.gz.sha256
      - uses: actions/upload-artifact@v4
        if: steps.config.outputs.ready == 'true'
        with:
          name: finanflow-backup-${{ github.run_id }}
          path: |
            finanflow.archive.gz
            finanflow.archive.gz.sha256
          retention-days: 30
